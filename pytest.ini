[pytest]
testpaths = tests
addopts = -ra

# SHAP emits this on every TreeExplainer call against a LightGBM binary classifier to
# announce that its return shape changed between versions. The project handles all three
# shapes in src/models/switching.py::_normalize_shap_values and has a test covering each,
# so the notice carries no information here and only obscures real warnings.
filterwarnings =
    ignore:LightGBM binary classifier with TreeExplainer shap values output has changed:UserWarning
